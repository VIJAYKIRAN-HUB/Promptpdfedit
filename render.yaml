services:
  - type: web
    name: promptpdf
    env: python
    buildCommand: "pip install -r requirements.txt && npm install && npm run build"
    startCommand: "uvicorn api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
